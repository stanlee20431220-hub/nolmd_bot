name: Twinscorestore Stock Check

on:
  schedule:
    - cron: "0 */3 * * *"  # 3시간마다 (전체 상품 크롤링이라 너무 자주 돌리지 않는 게 좋음)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_stock.py

      - name: Commit updated history
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@github.com"
          git add data/stock_history.json
          git diff --quiet --cached || git commit -m "재고 기록 업데이트 [skip ci]"
          git push
